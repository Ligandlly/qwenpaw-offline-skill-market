[package]
name = "offline-market-backend"
version = "0.1.7"
edition = "2021"
description = "Offline skill market backend for QwenPaw 2.2.2 hub tenants"
license = "MIT"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "trace"] }
sha2 = "0.10"
base64ct = { version = "1", features = ["alloc"] }
argon2 = "0.5"
rand = "0.8"
# Han -> plain pinyin for slug derivation (`周报助手` -> `zhoubaozhushou`).
# Only the "plain" feature: no tone marks, no heteronym table.
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
tracing = "0.1"
# fmt only: no env-filter/regex, the level comes from MARKET_LOG (see config.rs)
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# 发布构建面向「打包成镜像装进离线内网」：体积优先，但不动 opt-level
# （SQLite / argon2 是 CPU 热点）。strip 掉符号表，thin LTO + 单 codegen
# unit 让二进制小一截同时也不牺牲运行性能。
# 不加 panic = "abort"：tests/transport.rs 有测试靠 unwind 只弄挂单个请求。
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
